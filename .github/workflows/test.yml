name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test (pinned language)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned language
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Run examples
        run: |
          go run ./cmd/subc-poc run --prefetch 1 --fail editFiles=1 --reattempt editFiles=2 examples/fix.subc
          go run ./cmd/subc-poc run --prefetch 2 --ticks work=2 --concurrency 1 examples/prefetch.subc

  # Temporary: language PR #1 carries the design documents and conformance
  # changes this POC follows. Remove this job when the submodule moves to the
  # merge commit of that pull request (README "Merge checklist").
  test-language-pr:
    name: go test (language PR #1 head)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out language PR head
        uses: actions/checkout@v5
        with:
          repository: on-the-ground/subsea_cable_language
          ref: refs/pull/1/head
          path: language-pr

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        env:
          SUBSEA_LANGUAGE_DIR: ${{ github.workspace }}/language-pr
        run: go test ./...
